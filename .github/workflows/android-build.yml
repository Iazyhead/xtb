name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: pip install meson ninja

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Download Flang + LLVM Full Install
        run: |
          wget -q -O full-install.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-install.tar.bz2
          tar -xjf full-install.tar.bz2
          
          echo "===== Looking for flang binaries ====="
          find $PWD -type f -name 'flang*' -not -name '*.a' -not -name '*.cmake' 2>/dev/null
          
          echo ""
          echo "===== Looking for libLLVM shared libraries ====="
          find $PWD -name 'libLLVM*.so*' 2>/dev/null
          
          echo ""
          echo "===== Looking for libFortranRuntime shared libraries ====="
          find $PWD -name 'libFortranRuntime*' 2>/dev/null
          find $PWD -name 'libFortranDecimal*' 2>/dev/null
          
          # Save flang path
          FLANG_BIN=$(find $PWD -type f -name 'flang-*' -executable 2>/dev/null | head -n 1)
          if [ -z "$FLANG_BIN" ]; then
            FLANG_BIN=$(find $PWD -type f -name 'flang' -executable 2>/dev/null | head -n 1)
          fi
          echo "FLANG_BIN=$FLANG_BIN" >> $GITHUB_ENV
          echo "Selected flang: $FLANG_BIN"
          
          # Save LLVM lib dir
          LLVM_LIB=$(find $PWD -name 'libLLVM*.so*' 2>/dev/null | head -n 1)
          if [ -n "$LLVM_LIB" ]; then
            LLVM_LIB_DIR=$(dirname "$LLVM_LIB")
            echo "LLVM_LIB_DIR=$LLVM_LIB_DIR" >> $GITHUB_ENV
            echo "LLVM lib dir: $LLVM_LIB_DIR"
          fi
          
          echo ""
          echo "===== Testing flang ====="
          if [ -n "$LLVM_LIB_DIR" ]; then
            LD_LIBRARY_PATH="$LLVM_LIB_DIR:$LD_LIBRARY_PATH" "$FLANG_BIN" --version 2>&1 | head -n 5
          fi
          
          exit 0
