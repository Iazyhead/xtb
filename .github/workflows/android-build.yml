name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: pip install meson ninja

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Download Flang Toolchain
        run: |
          # Download the correct Flang package
          wget -O flang-host.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-host.tar.bz2
          tar -xjf flang-host.tar.bz2
          
          echo "--- Searching for compiler binaries ---"
          # Find the flang binary dynamically
          FLANG_PATH=$(find $PWD -type f -name '*flang*' | head -n 1)
          
          if [ -z "$FLANG_PATH" ]; then
            echo "ERROR: Could not find any flang binary. Listing all executables:"
            find $PWD -type f -executable | grep -E 'clang|flang' | head -n 20
            exit 1
          fi
          
          echo "Found compiler at: $FLANG_PATH"
          FLANG_BIN_DIR=$(dirname "$FLANG_PATH")
          FLANG_TOOLCHAIN=$(dirname "$FLANG_BIN_DIR")
          echo "FLANG_TOOLCHAIN=$FLANG_TOOLCHAIN" >> $GITHUB_ENV
          
          # Debug: List the contents of the bin directory
          echo "--- Contents of $FLANG_BIN_DIR ---"
          ls -la "$FLANG_BIN_DIR"

      - name: Create Meson cross-file
        run: |
          FLANG_BIN_DIR="${{ env.FLANG_TOOLCHAIN }}/bin"
          
          # Determine the exact compiler names (they might not have the aarch64 prefix)
          CLANG_BIN=$(find "$FLANG_BIN_DIR" -type f -name '*clang*' | head -n 1)
          FLANG_BIN=$(find "$FLANG_BIN_DIR" -type f -name '*flang*' | head -n 1)
          
          echo "Using C compiler: $CLANG_BIN"
          echo "Using Fortran compiler: $FLANG_BIN"

          cat > android-arm64.ini << EOF
          [binaries]
          c = '${CLANG_BIN}'
          fortran = '${FLANG_BIN}'
          ar = 'llvm-ar'
          strip = 'llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          default_library = 'shared'
          EOF

      - name: Configure build
        run: meson setup builddir --cross-file android-arm64.ini

      - name: Build project
        run: meson compile -C builddir

      - name: Upload libxtb.so
        uses: actions/upload-artifact@v4
        with:
          name: libxtb-android-arm64
          path: builddir/src/libxtb.so
