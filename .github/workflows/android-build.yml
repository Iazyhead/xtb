name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: pip install meson ninja

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Download Flang Toolchain
        run: |
          # Download the full toolchain package
          wget -O toolchain.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-install.tar.bz2
          tar -xjf toolchain.tar.bz2
          
          echo "--- Searching for clang and flang binaries ---"
          # Find the actual compiler binaries dynamically
          CLANG_BIN=$(find $PWD -type f -name 'clang' | head -n 1)
          FLANG_BIN=$(find $PWD -type f -name 'flang*' | head -n 1)
          
          echo "Found clang at: $CLANG_BIN"
          echo "Found flang at: $FLANG_BIN"
          
          if [ -z "$FLANG_BIN" ]; then
            echo "ERROR: Could not find flang. Listing all files with 'flang' in the name:"
            find $PWD -iname '*flang*'
            exit 1
          fi
          
          # Save the paths to use in the next step
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "FLANG_BIN=$FLANG_BIN" >> $GITHUB_ENV

      - name: Create Meson cross-file
        run: |
          echo "Using C compiler: ${{ env.CLANG_BIN }}"
          echo "Using Fortran compiler: ${{ env.FLANG_BIN }}"
          
          cat > android-arm64.ini << EOF
          [binaries]
          c = '${{ env.CLANG_BIN }}'
          fortran = '${{ env.FLANG_BIN }}'
          ar = 'llvm-ar'
          strip = 'llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          default_library = 'shared'
          EOF

      - name: Configure build
        run: meson setup builddir --cross-file android-arm64.ini

      - name: Build project
        run: meson compile -C builddir

      - name: Upload libxtb.so
        uses: actions/upload-artifact@v4
        with:
          name: libxtb-android-arm64
          path: builddir/src/libxtb.so
