name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: pip install meson ninja

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Download Flang Toolchain (Diagnostic)
        run: |
          # Download the correct Flang package
          wget -O flang-host.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-host.tar.bz2
          tar -xjf flang-host.tar.bz2
          
          echo "========== TOP LEVEL =========="
          ls -la
          
          echo ""
          echo "========== ANY FILE WITH 'flang' (any type, case-insensitive) =========="
          find . -iname '*flang*' 2>/dev/null
          
          echo ""
          echo "========== ANY FILE WITH 'fortran' =========="
          find . -iname '*fortran*' 2>/dev/null
          
          echo ""
          echo "========== ALL bin DIRECTORIES =========="
          find . -type d -name bin 2>/dev/null
          
          echo ""
          echo "========== CONTENTS OF EACH bin/ (including symlinks) =========="
          for d in $(find . -type d -name bin 2>/dev/null); do
            echo "--- $d ---"
            ls -la "$d"
            echo ""
          done
          
          echo "========== DONE =========="
          
          # Exit with 0 so the workflow succeeds and we can read the full log
          exit 0

      # The steps below are placeholders. They will fail if the diagnostic step
      # doesn't find the compilers, but that's fine. We will fix them in the
      # next iteration once we know the exact compiler paths.

      - name: Create Meson cross-file
        run: |
          echo "This step will be updated once we know the compiler paths."

      - name: Configure build
        run: |
          echo "This step will be updated once we know the compiler paths."

      - name: Build project
        run: |
          echo "This step will be updated once we know the compiler paths."

      - name: Upload libxtb.so
        uses: actions/upload-artifact@v4
        with:
          name: libxtb-android-arm64
          path: builddir/src/libxtb.so
