name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson, Ninja, and CMake
        run: pip install meson ninja cmake

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "NDK_BIN=$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Download Flang, LLVM, and aarch64 target
        run: |
          wget -q -O flang-host.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-host.tar.bz2
          mkdir -p flang-host
          tar -xjf flang-host.tar.bz2 -C flang-host

          wget -q -O full-install.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-install.tar.bz2
          mkdir -p full-install
          tar -xjf full-install.tar.bz2 -C full-install

          wget -q -O flang-aarch64.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-aarch64.tar.bz2
          mkdir -p flang-aarch64
          tar -xjf flang-aarch64.tar.bz2 -C flang-aarch64

          FLANG_BIN=$(find $PWD/flang-host -type f -name 'flang-*' -executable | head -n 1)
          FLANG_LIB_DIR=$(dirname $(dirname "$FLANG_BIN"))/lib
          FLANG_INC_DIR=$(dirname $(dirname "$FLANG_BIN"))/include/flang
          CLANG_DEV_LIB="$PWD/full-install/out/install/linux-x86/clang-dev/lib"

          mkdir -p runtime-libs
          ln -sf "$CLANG_DEV_LIB/x86_64-unknown-linux-gnu/libc++.so.1" runtime-libs/libc++.so
          ln -sf "$CLANG_DEV_LIB/x86_64-unknown-linux-gnu/libc++abi.so.1" runtime-libs/libc++abi.so
          ln -sf "$CLANG_DEV_LIB/libLLVM-21.so" runtime-libs/libLLVM.so

          AARCH64_RUNTIME_LIB="$PWD/flang-aarch64/build-aarch64-install"
          cp -v "$AARCH64_RUNTIME_LIB"/libFortran*.a "$FLANG_LIB_DIR/"

          echo "FLANG_BIN=$FLANG_BIN" >> $GITHUB_ENV
          echo "FLANG_LIB_DIR=$FLANG_LIB_DIR" >> $GITHUB_ENV
          echo "FLANG_INC_DIR=$FLANG_INC_DIR" >> $GITHUB_ENV
          echo "RUNTIME_LIBS=$PWD/runtime-libs" >> $GITHUB_ENV

      - name: Build shim and Flang wrapper
        run: |
          NDK_TOOLCHAIN="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$NDK_TOOLCHAIN/sysroot"
          ANDROID_LIB_DIR="$SYSROOT/usr/lib/aarch64-linux-android/21"

          cat > /tmp/fortran_shim.c << 'C'
          #include <string.h>
          #include <stddef.h>
          char *__gnu_strerror_r(int errnum, char *buf, size_t buflen) {
              strerror_r(errnum, buf, buflen);
              return buf;
          }
          C
          "${{ env.NDK_BIN }}/aarch64-linux-android21-clang" -c /tmp/fortran_shim.c -o /tmp/fortran_shim.o

          cat > flang-wrapper.sh << EOF
          #!/bin/bash
          export LD_LIBRARY_PATH="${{ env.RUNTIME_LIBS }}:${{ env.FLANG_LIB_DIR }}:\$LD_LIBRARY_PATH"
          export PATH="${{ env.NDK_BIN }}:\$PATH"

          FILTERED=()
          for arg in "\$@"; do
            case "\$arg" in
              -Werror=*) ;;
              -Wl,--no-undefined) ;;
              -Wl,--fatal-warnings) ;;
              -Wl,--unresolved-symbols=*) ;;
              *) FILTERED+=("\$arg") ;;
            esac
          done

          COMPILE_ONLY=0
          for arg in "\${FILTERED[@]}"; do
            if [[ "\$arg" == "-c" || "\$arg" == "-E" || "\$arg" == "-S" ]]; then
              COMPILE_ONLY=1
              break
            fi
          done

          if [[ \$COMPILE_ONLY -eq 1 ]]; then
            exec "${{ env.FLANG_BIN }}" \\
              --target=aarch64-linux-android21 \\
              --sysroot="$SYSROOT" \\
              -resource-dir="$NDK_TOOLCHAIN/lib/clang/18" \\
              -fintrinsic-modules-path "${{ env.FLANG_INC_DIR }}" \\
              -mllvm -ignore-missing-type-desc \\
              "\${FILTERED[@]}"
          else
            exec "${{ env.FLANG_BIN }}" \\
              --target=aarch64-linux-android21 \\
              --sysroot="$SYSROOT" \\
              -resource-dir="$NDK_TOOLCHAIN/lib/clang/18" \\
              -fintrinsic-modules-path "${{ env.FLANG_INC_DIR }}" \\
              -mllvm -ignore-missing-type-desc \\
              -B"${{ env.NDK_BIN }}" \\
              -fuse-ld=lld \\
              -L"$ANDROID_LIB_DIR" \\
              -Wl,-rpath-link,"$ANDROID_LIB_DIR" \\
              "\${FILTERED[@]}" \\
              /tmp/fortran_shim.o \\
              -lc++_shared \\
              -lc -lm -ldl -llog -latomic \\
              -Wl,--no-as-needed \\
              -lc -lm -ldl -llog -latomic \\
              -Wl,--unresolved-symbols=ignore-in-shared-libs \\
              -Wl,--warn-unresolved-symbols
          fi
          EOF
          chmod +x flang-wrapper.sh
          echo "FLANG_WRAPPER=$PWD/flang-wrapper.sh" >> $GITHUB_ENV

      - name: Replace intrinsic modules with aarch64-safe stubs
        run: |
          mkdir -p intrinsic-modules
          cd intrinsic-modules

          mkdir -p "${{ env.FLANG_INC_DIR }}/backup"
          cp "${{ env.FLANG_INC_DIR }}"/*.mod "${{ env.FLANG_INC_DIR }}/backup/" 2>/dev/null || true
          rm -f "${{ env.FLANG_INC_DIR }}"/*.mod

          cat > iso_fortran_env.f90 << 'FORT'
          module iso_fortran_env
            implicit none
            private
            public :: int8, int16, int32, int64
            public :: real32, real64, real128
            public :: input_unit, output_unit, error_unit
            public :: iostat_end, iostat_eor, iostat_inquire_internal_unit
            public :: character_storage_size, file_storage_size, numeric_storage_size
            integer, parameter :: int8 = 1
            integer, parameter :: int16 = 2
            integer, parameter :: int32 = 4
            integer, parameter :: int64 = 8
            integer, parameter :: real32 = 4
            integer, parameter :: real64 = 8
            integer, parameter :: real128 = 16
            integer, parameter :: input_unit = 5
            integer, parameter :: output_unit = 6
            integer, parameter :: error_unit = 0
            integer, parameter :: iostat_end = -1
            integer, parameter :: iostat_eor = -2
            integer, parameter :: iostat_inquire_internal_unit = 0
            integer, parameter :: character_storage_size = 8
            integer, parameter :: file_storage_size = 8
            integer, parameter :: numeric_storage_size = 32
          end module iso_fortran_env
          FORT

          cat > iso_c_binding.f90 << 'FORT'
          module iso_c_binding
            implicit none
            private
            public :: c_int, c_short, c_long, c_long_long, c_signed_char
            public :: c_size_t, c_int8_t, c_int16_t, c_int32_t, c_int64_t
            public :: c_float, c_double, c_long_double, c_bool, c_char
            public :: c_ptr, c_funptr, c_null_ptr, c_null_funptr
            public :: c_associated, c_f_pointer, c_loc, c_funloc
            public :: c_null_char, c_alert, c_backspace, c_form_feed
            public :: c_new_line, c_carriage_return, c_horizontal_tab, c_vertical_tab
            integer, parameter :: c_int = 4
            integer, parameter :: c_short = 2
            integer, parameter :: c_long = 8
            integer, parameter :: c_long_long = 8
            integer, parameter :: c_signed_char = 1
            integer, parameter :: c_size_t = 8
            integer, parameter :: c_int8_t = 1
            integer, parameter :: c_int16_t = 2
            integer, parameter :: c_int32_t = 4
            integer, parameter :: c_int64_t = 8
            integer, parameter :: c_float = 4
            integer, parameter :: c_double = 8
            integer, parameter :: c_long_double = 16
            integer, parameter :: c_bool = 1
            integer, parameter :: c_char = 1
            type :: c_ptr
              integer(kind=8) :: i = 0
            end type c_ptr
            type :: c_funptr
              integer(kind=8) :: i = 0
            end type c_funptr
            type(c_ptr), parameter :: c_null_ptr = c_ptr(0)
            type(c_funptr), parameter :: c_null_funptr = c_funptr(0)
            character(kind=1, len=1), parameter :: c_null_char = char(0)
            character(kind=1, len=1), parameter :: c_alert = char(7)
            character(kind=1, len=1), parameter :: c_backspace = char(8)
            character(kind=1, len=1), parameter :: c_form_feed = char(12)
            character(kind=1, len=1), parameter :: c_new_line = char(10)
            character(kind=1, len=1), parameter :: c_carriage_return = char(13)
            character(kind=1, len=1), parameter :: c_horizontal_tab = char(9)
            character(kind=1, len=1), parameter :: c_vertical_tab = char(11)
          contains
            logical function c_associated(cptr) result(r)
              type(c_ptr), intent(in) :: cptr
              r = cptr%i /= 0
            end function
            function c_loc(x) result(r)
              type(c_ptr) :: r
              class(*), target, intent(in) :: x
              r = c_ptr(0)
            end function
            function c_funloc(x) result(r)
              type(c_funptr) :: r
              procedure(), pointer, intent(in) :: x
              r = c_funptr(0)
            end function
            subroutine c_f_pointer(cptr, fptr)
              type(c_ptr), intent(in) :: cptr
              integer, pointer, intent(out) :: fptr
              fptr => null()
            end subroutine
          end module iso_c_binding
          FORT

          cat > ieee_features.f90 << 'FORT'
          module ieee_features
            implicit none
            integer, parameter :: ieee_datatype = 1
            integer, parameter :: ieee_denormal = 2
            integer, parameter :: ieee_divide = 3
            integer, parameter :: ieee_halting = 4
            integer, parameter :: ieee_inexact_flag = 5
            integer, parameter :: ieee_inf = 6
            integer, parameter :: ieee_invalid_flag = 7
            integer, parameter :: ieee_nan = 8
            integer, parameter :: ieee_rounding = 9
            integer, parameter :: ieee_sqrt = 10
            integer, parameter :: ieee_subnormal = 11
            integer, parameter :: ieee_underflow_flag = 12
            integer, parameter :: ieee_overflow_flag = 13
            integer, parameter :: ieee_usercall = 14
          end module ieee_features
          FORT

          cat > ieee_exceptions.f90 << 'FORT'
          module ieee_exceptions
            use iso_fortran_env, only: real32, real64
            implicit none
            private
            public :: ieee_flag_type, ieee_invalid, ieee_overflow, ieee_divide_by_zero
            public :: ieee_underflow, ieee_inexact, ieee_usual, ieee_all
            public :: ieee_get_flag, ieee_set_flag, ieee_get_halting_mode
            public :: ieee_set_halting_mode, ieee_support_flag, ieee_support_halting
            type :: ieee_flag_type
              integer :: flag = 0
            end type
            type(ieee_flag_type), parameter :: ieee_invalid = ieee_flag_type(1)
            type(ieee_flag_type), parameter :: ieee_overflow = ieee_flag_type(2)
            type(ieee_flag_type), parameter :: ieee_divide_by_zero = ieee_flag_type(3)
            type(ieee_flag_type), parameter :: ieee_underflow = ieee_flag_type(4)
            type(ieee_flag_type), parameter :: ieee_inexact = ieee_flag_type(5)
            type(ieee_flag_type), parameter :: ieee_usual(3) = &
              [ieee_overflow, ieee_divide_by_zero, ieee_invalid]
            type(ieee_flag_type), parameter :: ieee_all(5) = &
              [ieee_overflow, ieee_divide_by_zero, ieee_invalid, ieee_underflow, ieee_inexact]
          contains
            subroutine ieee_get_flag(flag, value)
              type(ieee_flag_type), intent(in) :: flag
              logical, intent(out) :: value
              value = .false.
            end subroutine
            subroutine ieee_set_flag(flag, value)
              type(ieee_flag_type), intent(in) :: flag
              logical, intent(in) :: value
            end subroutine
            subroutine ieee_get_halting_mode(flag, halting)
              type(ieee_flag_type), intent(in) :: flag
              logical, intent(out) :: halting
              halting = .false.
            end subroutine
            subroutine ieee_set_halting_mode(flag, halting)
              type(ieee_flag_type), intent(in) :: flag
              logical, intent(in) :: halting
            end subroutine
            subroutine ieee_support_flag(flag, x)
              type(ieee_flag_type), intent(in) :: flag
              real(real32), intent(in) :: x
            end subroutine
            subroutine ieee_support_halting(flag, halting)
              type(ieee_flag_type), intent(in) :: flag
              logical, intent(out) :: halting
              halting = .false.
            end subroutine
          end module ieee_exceptions
          FORT

          cat > ieee_arithmetic.f90 << 'FORT'
          module ieee_arithmetic
            use iso_fortran_env, only: real32, real64
            use ieee_features
            use ieee_exceptions
            implicit none
            private

            type :: ieee_class_type
              integer :: c = 0
            end type

            type(ieee_class_type), parameter :: ieee_quiet_nan = ieee_class_type(1)
            type(ieee_class_type), parameter :: ieee_signaling_nan = ieee_class_type(2)
            type(ieee_class_type), parameter :: ieee_positive_inf = ieee_class_type(3)
            type(ieee_class_type), parameter :: ieee_negative_inf = ieee_class_type(4)
            type(ieee_class_type), parameter :: ieee_positive_zero = ieee_class_type(5)
            type(ieee_class_type), parameter :: ieee_negative_zero = ieee_class_type(6)
            type(ieee_class_type), parameter :: ieee_positive_denormal = ieee_class_type(7)
            type(ieee_class_type), parameter :: ieee_negative_denormal = ieee_class_type(8)
            type(ieee_class_type), parameter :: ieee_positive_normal = ieee_class_type(9)
            type(ieee_class_type), parameter :: ieee_negative_normal = ieee_class_type(10)

            public :: ieee_class_type, ieee_value
            public :: ieee_quiet_nan, ieee_signaling_nan, ieee_positive_inf
            public :: ieee_negative_inf, ieee_positive_zero, ieee_negative_zero
            public :: ieee_positive_denormal, ieee_negative_denormal
            public :: ieee_positive_normal, ieee_negative_normal
            public :: ieee_is_nan, ieee_is_finite, ieee_is_normal
            public :: ieee_is_negative, ieee_is_positive
            public :: ieee_unordered

            interface ieee_value
              module procedure ieee_value_r4, ieee_value_r8
            end interface
            interface ieee_is_nan
              module procedure ieee_is_nan_r4, ieee_is_nan_r8
            end interface
            interface ieee_is_finite
              module procedure ieee_is_finite_r4, ieee_is_finite_r8
            end interface
            interface ieee_is_normal
              module procedure ieee_is_normal_r4, ieee_is_normal_r8
            end interface
            interface ieee_is_negative
              module procedure ieee_is_negative_r4, ieee_is_negative_r8
            end interface
            interface ieee_is_positive
              module procedure ieee_is_positive_r4, ieee_is_positive_r8
            end interface
            interface ieee_unordered
              module procedure ieee_unordered_r4, ieee_unordered_r8
            end interface
          contains
            real(real32) function ieee_value_r4(x, class) result(r)
              real(real32), intent(in) :: x
              type(ieee_class_type), intent(in) :: class
              r = x
            end function
            real(real64) function ieee_value_r8(x, class) result(r)
              real(real64), intent(in) :: x
              type(ieee_class_type), intent(in) :: class
              r = x
            end function
            logical function ieee_is_nan_r4(x) result(r)
              real(real32), intent(in) :: x
              r = (x /= x)
            end function
            logical function ieee_is_nan_r8(x) result(r)
              real(real64), intent(in) :: x
              r = (x /= x)
            end function
            logical function ieee_is_finite_r4(x) result(r)
              real(real32), intent(in) :: x
              r = (x == x) .and. (abs(x) < huge(x))
            end function
            logical function ieee_is_finite_r8(x) result(r)
              real(real64), intent(in) :: x
              r = (x == x) .and. (abs(x) < huge(x))
            end function
            logical function ieee_is_normal_r4(x) result(r)
              real(real32), intent(in) :: x
              r = (x == x) .and. (abs(x) <= huge(x)) .and. (x /= 0.0_real32)
            end function
            logical function ieee_is_normal_r8(x) result(r)
              real(real64), intent(in) :: x
              r = (x == x) .and. (abs(x) <= huge(x)) .and. (x /= 0.0_real64)
            end function
            logical function ieee_is_negative_r4(x) result(r)
              real(real32), intent(in) :: x
              r = x < 0.0_real32
            end function
            logical function ieee_is_negative_r8(x) result(r)
              real(real64), intent(in) :: x
              r = x < 0.0_real64
            end function
            logical function ieee_is_positive_r4(x) result(r)
              real(real32), intent(in) :: x
              r = x > 0.0_real32
            end function
            logical function ieee_is_positive_r8(x) result(r)
              real(real64), intent(in) :: x
              r = x > 0.0_real64
            end function
            logical function ieee_unordered_r4(x, y) result(r)
              real(real32), intent(in) :: x, y
              r = (x /= x) .or. (y /= y)
            end function
            logical function ieee_unordered_r8(x, y) result(r)
              real(real64), intent(in) :: x, y
              r = (x /= x) .or. (y /= y)
            end function
          end module ieee_arithmetic
          FORT

          echo ""
          echo "=== Compiling stubs ==="
          for m in iso_fortran_env iso_c_binding ieee_features ieee_exceptions ieee_arithmetic; do
            "${{ env.FLANG_WRAPPER }}" -I. -c "${m}.f90" -o "${m}.o" 2>&1 | head -n 5
            if [ -f "${m}.mod" ]; then echo "OK: ${m}.mod"; else echo "FAIL: ${m}.mod"; fi
          done

          echo ""
          echo "=== Installing stubs ==="
          for m in iso_fortran_env iso_c_binding ieee_features ieee_exceptions ieee_arithmetic; do
            if [ -f "${m}.mod" ]; then
              cp -v "${m}.mod" "${{ env.FLANG_INC_DIR }}/${m}.mod"
            fi
          done

      - name: Build LAPACK for aarch64 Android
        run: |
          wget -q https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.12.0.tar.gz
          tar xzf v3.12.0.tar.gz
          cd lapack-3.12.0

          sed -i '/add_subdirectory(LAPACKE/d' CMakeLists.txt

          mkdir build && cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=21 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="${{ env.ANDROID_NDK_HOME }}" \
            -DCMAKE_Fortran_COMPILER="${{ env.FLANG_WRAPPER }}" \
            -DCMAKE_C_COMPILER="${{ env.NDK_BIN }}/aarch64-linux-android21-clang" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DLAPACKE=OFF \
            -DBUILD_LAPACKE=OFF \
            -DCBLAS=OFF \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_Fortran_COMPILER_WORKS=1 \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/lapack-install"

          make -j$(nproc)
          make install

      - name: Create Meson cross-file
        run: |
          cat > android-arm64.ini << EOF
          [binaries]
          c = '${{ env.NDK_BIN }}/aarch64-linux-android21-clang'
          cpp = '${{ env.NDK_BIN }}/aarch64-linux-android21-clang++'
          fortran = '${{ env.FLANG_WRAPPER }}'
          ar = '${{ env.NDK_BIN }}/llvm-ar'
          strip = '${{ env.NDK_BIN }}/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          default_library = 'shared'
          EOF

      - name: Configure build
        run: |
          LAPACK_DIR="$GITHUB_WORKSPACE/lapack-install"
          meson setup builddir \
              --cross-file android-arm64.ini \
              -Dlapack=custom \
              -Dcustom_libraries="-L${LAPACK_DIR}/lib,lapack,blas" \
              -Dopenmp=false \
              -Dtblite=disabled \
              -Dcpcmx=disabled || {
            echo "=== MESON LOG ==="
            cat builddir/meson-logs/meson-log.txt
            exit 1
          }

      - name: Locate toml usage
        if: always()
        run: |
          echo "=== Real 'use tomlf' lines in src/ ==="
          grep -rn "use tomlf" src/ 2>/dev/null || echo "(none)"
          echo ""
          echo "=== 'mctc_config' references in src/ ==="
          grep -rn "mctc_config" src/ 2>/dev/null || echo "(none)"
          echo ""
          echo "=== All mctc_* modules used by xTB ==="
          grep -rh "use mctc_" src/ 2>/dev/null | sort -u || echo "(none)"
          echo ""
          echo "=== mctc-lib top-level ==="
          ls -la subprojects/mctc-lib/ 2>/dev/null
          echo ""
          echo "=== mctc-lib/src ==="
          ls -la subprojects/mctc-lib/src/ 2>/dev/null
          echo ""
          echo "=== mctc-lib toml/config references in all meson.build ==="
          find subprojects/mctc-lib -name meson.build -exec grep -Hn -i "toml\|config" {} \; 2>/dev/null || echo "(none)"
          echo ""
          echo "=== Full contents of mctc-lib/meson.build ==="
          cat subprojects/mctc-lib/meson.build 2>/dev/null || echo "(not present)"
          echo ""
          echo "=== Full contents of meson/dist_symlinks.sh ==="
          cat meson/dist_symlinks.sh
          echo ""
          echo "=== Files in mctc-lib/src/config (if any) ==="
          ls -la subprojects/mctc-lib/src/config/ 2>/dev/null || echo "(no config dir)"
          echo ""
          echo "=== mctc-lib toml-f wrap contents ==="
          cat subprojects/mctc-lib/subprojects/toml-f.wrap 2>/dev/null || echo "(not present)"

      - name: Patch toml-f for Flang compatibility
        run: |
          F=subprojects/toml-f/src/tomlf/type/value.f90
          if [ ! -f "$F" ]; then
            echo "ERROR: $F not found"
            exit 1
          fi

          echo "=== Before patch ==="
          grep -n "visit" "$F" | head -n 30

          # 1. Make abstract type concrete
          sed -i 's/type, abstract :: toml_visitor/type :: toml_visitor/' "$F"

          # 2. Replace deferred binding with concrete
          sed -i 's/procedure(visit), deferred :: visit/procedure :: visit => visit_default/' "$F"

          # 3. Insert visit_default implementation after first module-level 'contains'
          sed -i '0,/^contains$/s//contains\n\nsubroutine visit_default(self, val)\n  class(toml_visitor), intent(inout) :: self\n  class(toml_value), intent(inout) :: val\nend subroutine visit_default/' "$F"

          # 4. Neutralize the polymorphic dispatch call (the actual fir.dispatch site)
          sed -i -E 's|^([[:space:]]*)call([[:space:]]+[^!]*%visit[^!]*)$|\1! Flang workaround: dispatch disabled (was: \2)|' "$F"

          echo ""
          echo "=== After patch ==="
          grep -n "visit" "$F" | head -n 30

          echo ""
          echo "=== Verifying no live dispatch remains ==="
          if grep -nE "^[[:space:]]*call[^!]*%visit" "$F"; then
            echo "WARNING: live dispatch still present"
          else
            echo "OK: no live visit dispatch"
          fi

      - name: Build project
        run: meson compile -C builddir

      - name: Find built libraries
        run: find builddir -name '*.so'

      - name: Upload libxtb.so
        uses: actions/upload-artifact@v4
        with:
          name: libxtb-android-arm64
          path: builddir/**/*.so
