name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: pip install meson ninja

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Download Flang, LLVM, and aarch64 target
        run: |
          wget -q -O flang-host.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-host.tar.bz2
          mkdir -p flang-host
          tar -xjf flang-host.tar.bz2 -C flang-host

          wget -q -O full-install.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-install.tar.bz2
          mkdir -p full-install
          tar -xjf full-install.tar.bz2 -C full-install

          wget -q -O flang-aarch64.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-aarch64.tar.bz2
          mkdir -p flang-aarch64
          tar -xjf flang-aarch64.tar.bz2 -C flang-aarch64

          echo "=================================================="
          echo "=== CONTENTS OF package-flang-aarch64          ==="
          echo "=================================================="
          find flang-aarch64 -type f | head -n 80

          echo ""
          echo "=== Looking for libFortranRuntime.a in aarch64 ==="
          find flang-aarch64 -name 'libFortranRuntime*' 2>/dev/null

          echo ""
          echo "=== Looking for ANY libFortran* in aarch64 ==="
          find flang-aarch64 -name 'libFortran*' 2>/dev/null

          echo ""
          echo "=== File types of found .a files ==="
          for f in $(find flang-aarch64 -name 'libFortran*.a' 2>/dev/null); do
            echo "--- $f ---"
            file "$f"
          done

          FLANG_BIN=$(find $PWD/flang-host -type f -name 'flang-*' -executable | head -n 1)
          FLANG_LIB_DIR=$(dirname $(dirname "$FLANG_BIN"))/lib
          CLANG_DEV_LIB="$PWD/full-install/out/install/linux-x86/clang-dev/lib"

          mkdir -p runtime-libs
          ln -sf "$CLANG_DEV_LIB/x86_64-unknown-linux-gnu/libc++.so.1" runtime-libs/libc++.so
          ln -sf "$CLANG_DEV_LIB/x86_64-unknown-linux-gnu/libc++abi.so.1" runtime-libs/libc++abi.so
          ln -sf "$CLANG_DEV_LIB/libLLVM-21.so" runtime-libs/libLLVM.so

          RUNTIME_LIBS="$PWD/runtime-libs"
          AARCH64_RUNTIME_LIB=$(find $PWD/flang-aarch64 -name 'libFortranRuntime.a' -exec dirname {} \; | head -n 1)

          echo "FLANG_BIN=$FLANG_BIN" >> $GITHUB_ENV
          echo "FLANG_LIB_DIR=$FLANG_LIB_DIR" >> $GITHUB_ENV
          echo "RUNTIME_LIBS=$RUNTIME_LIBS" >> $GITHUB_ENV
          echo "AARCH64_RUNTIME_LIB=$AARCH64_RUNTIME_LIB" >> $GITHUB_ENV

          echo ""
          echo "AARCH64_RUNTIME_LIB=$AARCH64_RUNTIME_LIB"

      - name: Overwrite host runtime with aarch64 runtime
        run: |
          if [ -z "${{ env.AARCH64_RUNTIME_LIB }}" ]; then
            echo "ERROR: No aarch64 Fortran runtime found in package-flang-aarch64."
            echo "We will need a different strategy."
            exit 1
          fi

          echo "Host Fortran runtime dir: ${{ env.FLANG_LIB_DIR }}"
          echo "aarch64 Fortran runtime dir: ${{ env.AARCH64_RUNTIME_LIB }}"

          echo ""
          echo "=== Before: file type of host libFortranRuntime.a ==="
          file "${{ env.FLANG_LIB_DIR }}/libFortranRuntime.a" || true

          echo ""
          echo "=== Copying aarch64 runtime over host runtime ==="
          cp -v "${{ env.AARCH64_RUNTIME_LIB }}"/libFortran*.a "${{ env.FLANG_LIB_DIR }}/" || true

          echo ""
          echo "=== After: file type of host libFortranRuntime.a ==="
          file "${{ env.FLANG_LIB_DIR }}/libFortranRuntime.a" || true

      - name: Create Flang wrapper
        run: |
          NDK_TOOLCHAIN="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$NDK_TOOLCHAIN/sysroot"
          NDK_BIN="$NDK_TOOLCHAIN/bin"

          cat > flang-wrapper.sh << EOF
          #!/bin/bash
          export LD_LIBRARY_PATH="${{ env.RUNTIME_LIBS }}:${{ env.FLANG_LIB_DIR }}:\$LD_LIBRARY_PATH"
          export PATH="$NDK_BIN:\$PATH"
          exec "${{ env.FLANG_BIN }}" \\
              --target=aarch64-linux-android21 \\
              --sysroot="$SYSROOT" \\
              -resource-dir="$NDK_TOOLCHAIN/lib/clang/18" \\
              -B"$NDK_BIN" \\
              -fuse-ld=lld \\
              "\$@"
          EOF
          chmod +x flang-wrapper.sh
          echo "FLANG_WRAPPER=$PWD/flang-wrapper.sh" >> $GITHUB_ENV

      - name: Test link with aarch64 runtime
        run: |
          cat > /tmp/test.f90 << 'FORT'
          program hello
            print *, "hello"
          end program hello
          FORT

          echo "=== Compile and link ==="
          ./flang-wrapper.sh /tmp/test.f90 -o /tmp/test
          echo "Exit code: $?"
          ls -la /tmp/test 2>&1 || true
          file /tmp/test 2>&1 || true

      - name: Create Meson cross-file
        run: |
          NDK_BIN="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cat > android-arm64.ini << EOF
          [binaries]
          c = '${NDK_BIN}/aarch64-linux-android21-clang'
          cpp = '${NDK_BIN}/aarch64-linux-android21-clang++'
          fortran = '${{ env.FLANG_WRAPPER }}'
          ar = '${NDK_BIN}/llvm-ar'
          strip = '${NDK_BIN}/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          default_library = 'shared'
          EOF

      - name: Configure build
        run: |
          meson setup builddir \
              --cross-file android-arm64.ini \
              -Dlapack=custom \
              -Dcustom_libraries= \
              -Dopenmp=false \
              -Dtblite=disabled \
              -Dcpcmx=disabled || {
            echo "=== MESON LOG ==="
            cat builddir/meson-logs/meson-log.txt
            exit 1
          }

      - name: Build project
        run: meson compile -C builddir

      - name: Find built libraries
        run: find builddir -name '*.so'

      - name: Upload libxtb.so
        uses: actions/upload-artifact@v4
        with:
          name: libxtb-android-arm64
          path: builddir/**/*.so
