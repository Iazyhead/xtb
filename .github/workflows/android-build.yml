name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson, Ninja, and CMake
        run: pip install meson ninja cmake

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "NDK_BIN=$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Download Flang, LLVM, and aarch64 target
        run: |
          wget -q -O flang-host.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-host.tar.bz2
          mkdir -p flang-host
          tar -xjf flang-host.tar.bz2 -C flang-host

          wget -q -O full-install.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-install.tar.bz2
          mkdir -p full-install
          tar -xjf full-install.tar.bz2 -C full-install

          wget -q -O flang-aarch64.tar.bz2 https://github.com/termux/ndk-toolchain-clang-with-flang/releases/download/r29-1/package-flang-aarch64.tar.bz2
          mkdir -p flang-aarch64
          tar -xjf flang-aarch64.tar.bz2 -C flang-aarch64

          FLANG_BIN=$(find $PWD/flang-host -type f -name 'flang-*' -executable | head -n 1)
          FLANG_LIB_DIR=$(dirname $(dirname "$FLANG_BIN"))/lib
          CLANG_DEV_LIB="$PWD/full-install/out/install/linux-x86/clang-dev/lib"

          mkdir -p runtime-libs
          ln -sf "$CLANG_DEV_LIB/x86_64-unknown-linux-gnu/libc++.so.1" runtime-libs/libc++.so
          ln -sf "$CLANG_DEV_LIB/x86_64-unknown-linux-gnu/libc++abi.so.1" runtime-libs/libc++abi.so
          ln -sf "$CLANG_DEV_LIB/libLLVM-21.so" runtime-libs/libLLVM.so

          AARCH64_RUNTIME_LIB="$PWD/flang-aarch64/build-aarch64-install"
          cp -v "$AARCH64_RUNTIME_LIB"/libFortran*.a "$FLANG_LIB_DIR/"

          echo "FLANG_BIN=$FLANG_BIN" >> $GITHUB_ENV
          echo "FLANG_LIB_DIR=$FLANG_LIB_DIR" >> $GITHUB_ENV
          echo "RUNTIME_LIBS=$PWD/runtime-libs" >> $GITHUB_ENV

      - name: Build shim and Flang wrapper
        run: |
          NDK_TOOLCHAIN="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$NDK_TOOLCHAIN/sysroot"
          ANDROID_LIB_DIR="$SYSROOT/usr/lib/aarch64-linux-android/21"

          cat > /tmp/fortran_shim.c << 'C'
          #include <string.h>
          #include <stddef.h>
          char *__gnu_strerror_r(int errnum, char *buf, size_t buflen) {
              strerror_r(errnum, buf, buflen);
              return buf;
          }
          C
          "${{ env.NDK_BIN }}/aarch64-linux-android21-clang" -c /tmp/fortran_shim.c -o /tmp/fortran_shim.o

          cat > flang-wrapper.sh << EOF
          #!/bin/bash
          export LD_LIBRARY_PATH="${{ env.RUNTIME_LIBS }}:${{ env.FLANG_LIB_DIR }}:\$LD_LIBRARY_PATH"
          export PATH="${{ env.NDK_BIN }}:\$PATH"

          FILTERED=()
          for arg in "\$@"; do
            case "\$arg" in
              -Werror=*) ;;
              -Wl,--no-undefined) ;;
              -Wl,--fatal-warnings) ;;
              -Wl,--unresolved-symbols=*) ;;
              *) FILTERED+=("\$arg") ;;
            esac
          done

          COMPILE_ONLY=0
          for arg in "\${FILTERED[@]}"; do
            if [[ "\$arg" == "-c" || "\$arg" == "-E" || "\$arg" == "-S" ]]; then
              COMPILE_ONLY=1
              break
            fi
          done

          INTRINSIC_PATH=""
          if [ -d "$GITHUB_WORKSPACE/intrinsic-modules" ]; then
            INTRINSIC_PATH="-fintrinsic-modules-path=$GITHUB_WORKSPACE/intrinsic-modules"
          fi

          if [[ \$COMPILE_ONLY -eq 1 ]]; then
            exec "${{ env.FLANG_BIN }}" \\
              --target=aarch64-linux-android21 \\
              --sysroot="$SYSROOT" \\
              -resource-dir="$NDK_TOOLCHAIN/lib/clang/18" \\
              \$INTRINSIC_PATH \\
              "\${FILTERED[@]}"
          else
            exec "${{ env.FLANG_BIN }}" \\
              --target=aarch64-linux-android21 \\
              --sysroot="$SYSROOT" \\
              -resource-dir="$NDK_TOOLCHAIN/lib/clang/18" \\
              \$INTRINSIC_PATH \\
              -B"${{ env.NDK_BIN }}" \\
              -fuse-ld=lld \\
              -L"$ANDROID_LIB_DIR" \\
              -Wl,-rpath-link,"$ANDROID_LIB_DIR" \\
              "\${FILTERED[@]}" \\
              /tmp/fortran_shim.o \\
              -lc++_shared \\
              -lc -lm -ldl -llog -latomic \\
              -Wl,--no-as-needed \\
              -lc -lm -ldl -llog -latomic \\
              -Wl,--unresolved-symbols=ignore-in-shared-libs \\
              -Wl,--warn-unresolved-symbols
          fi
          EOF
          chmod +x flang-wrapper.sh
          echo "FLANG_WRAPPER=$PWD/flang-wrapper.sh" >> $GITHUB_ENV

      - name: Rebuild intrinsic modules for aarch64
        run: |
          LLVM_COMMIT="5e96669f06077099aa41290cdb4c5e6fa0f59349"
          BASE_URL="https://raw.githubusercontent.com/llvm/llvm-project/${LLVM_COMMIT}/flang/module"

          mkdir -p intrinsic-modules
          cd intrinsic-modules

          # Download flang's intrinsic module source files
          # Compile in dependency order (kinds and C binding first).
          for m in iso_fortran_env iso_c_binding ieee_features ieee_exceptions ieee_arithmetic; do
            echo "=== Downloading $m.f90 ==="
            wget -q -O "${m}.f90" "${BASE_URL}/${m}.f90" && echo "OK: $m.f90" || echo "FAIL: $m.f90"
          done

          echo ""
          echo "=== Sources downloaded ==="
          ls -la

          echo ""
          echo "=== Compiling intrinsic modules for aarch64 ==="
          for m in iso_fortran_env iso_c_binding ieee_features ieee_exceptions ieee_arithmetic; do
            if [ -f "${m}.f90" ]; then
              echo "--- Compiling $m ---"
              "${{ env.FLANG_WRAPPER }}" -c "${m}.f90" -o "${m}.o" 2>&1 | head -n 20
              if [ -f "${m}.mod" ]; then
                echo "OK: ${m}.mod generated"
              else
                echo "FAIL: ${m}.mod NOT generated"
              fi
            fi
          done

          echo ""
          echo "=== Resulting .mod files ==="
          ls -la *.mod 2>&1 || echo "No .mod files were generated!"

      - name: Build LAPACK for aarch64 Android
        run: |
          wget -q https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.12.0.tar.gz
          tar xzf v3.12.0.tar.gz
          cd lapack-3.12.0

          sed -i '/add_subdirectory(LAPACKE/d' CMakeLists.txt

          mkdir build && cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=21 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="${{ env.ANDROID_NDK_HOME }}" \
            -DCMAKE_Fortran_COMPILER="${{ env.FLANG_WRAPPER }}" \
            -DCMAKE_C_COMPILER="${{ env.NDK_BIN }}/aarch64-linux-android21-clang" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DLAPACKE=OFF \
            -DBUILD_LAPACKE=OFF \
            -DCBLAS=OFF \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_Fortran_COMPILER_WORKS=1 \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/lapack-install"

          make -j$(nproc)
          make install

          echo ""
          echo "=== LAPACK installed files ==="
          find "$GITHUB_WORKSPACE/lapack-install" -name '*.so*' -o -name '*.a'

      - name: Create Meson cross-file
        run: |
          cat > android-arm64.ini << EOF
          [binaries]
          c = '${{ env.NDK_BIN }}/aarch64-linux-android21-clang'
          cpp = '${{ env.NDK_BIN }}/aarch64-linux-android21-clang++'
          fortran = '${{ env.FLANG_WRAPPER }}'
          ar = '${{ env.NDK_BIN }}/llvm-ar'
          strip = '${{ env.NDK_BIN }}/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          default_library = 'shared'
          EOF

      - name: Configure build
        run: |
          LAPACK_DIR="$GITHUB_WORKSPACE/lapack-install"
          meson setup builddir \
              --cross-file android-arm64.ini \
              -Dlapack=custom \
              -Dcustom_libraries="-L${LAPACK_DIR}/lib,lapack,blas" \
              -Dopenmp=false \
              -Dtblite=disabled \
              -Dcpcmx=disabled || {
            echo "=== MESON LOG ==="
            cat builddir/meson-logs/meson-log.txt
            exit 1
          }

      - name: Build project
        run: meson compile -C builddir

      - name: Find built libraries
        run: find builddir -name '*.so'

      - name: Upload libxtb.so
        uses: actions/upload-artifact@v4
        with:
          name: libxtb-android-arm64
          path: builddir/**/*.so
